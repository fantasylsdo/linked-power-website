# Main website: linked-power.com
# Astro Node SSR listens on 127.0.0.1:3001.
# HTTPS certificate files are expected under /etc/nginx/ssl/
# - /etc/nginx/ssl/linked-power.com_bundle.crt
# - /etc/nginx/ssl/linked-power.com.key

server {
    listen 80;
    server_name linked-power.com www.linked-power.com;
    return 301 https://linked-power.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name linked-power.com;

    ssl_certificate /etc/nginx/ssl/linked-power.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/linked-power.com.key;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect www to the canonical bare domain on HTTPS.
server {
    listen 443 ssl http2;
    server_name www.linked-power.com;

    ssl_certificate /etc/nginx/ssl/linked-power.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/linked-power.com.key;

    return 301 https://linked-power.com$request_uri;
}

# Existing production system: prod.linked-power.com
# Keep the existing application on 127.0.0.1:8000.
server {
    listen 80;
    server_name prod.linked-power.com;

    root /var/www/production-system/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/production/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional: keep direct IP access for the existing production system.
server {
    listen 80;
    server_name 47.92.148.9;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
