# Main website: linked-power.com
# Astro Node SSR listens on 127.0.0.1:3001.
server {
    listen 80;
    server_name linked-power.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect www to the canonical bare domain.
server {
    listen 80;
    server_name www.linked-power.com;

    return 301 http://linked-power.com$request_uri;
}

# Existing production system: prod.linked-power.com
# Keep the existing application on 127.0.0.1:8000.
server {
    listen 80;
    server_name prod.linked-power.com;

    root /var/www/production-system/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/production/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Optional: keep direct IP access for the existing production system.
server {
    listen 80;
    server_name 47.92.148.9;

    root /var/www/production-system/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/production/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
